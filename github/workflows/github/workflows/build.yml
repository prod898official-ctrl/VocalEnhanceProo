name: Build VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/VocalEnhancePro_artefacts/Release/VST3/VocalEnhancePro.vst3" dist/
          Compress-Archive -Path dist/VocalEnhancePro.vst3 -DestinationPath VocalEnhancePro-Windows-VST3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalEnhancePro-Windows-VST3
          path: VocalEnhancePro-Windows-VST3.zip

      - name: Release (tagi v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VocalEnhancePro-Windows-VST3.zip
